name: Sync from portfolio

on:
  schedule:
    - cron: "17 23 * * *" # every day at 06:17 WIB
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update README from irvandani.pages.dev
        run: python3 scripts/sync_portfolio.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync projects from portfolio"
          git push
